<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic meta tags for character set and responsive viewport -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Page title displayed in browser tab -->
  <title>Compliance Framework Matrix</title>
  
  <!-- External script dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.1/papaparse.min.js"></script> <!-- CSV parsing library -->
  <script src="https://cdn.jsdelivr.net/npm/tippy.js@6/dist/tippy-bundle.umd.min.js"></script> <!-- Tooltip library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script> <!-- PDF generation library -->
  
  <!-- External CSS for tooltip animations -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tippy.js@6/animations/scale.css"/>
  
  <!-- Internal CSS styles -->
  <style>
    /* CSS variables for consistent theming */
    :root {
      --regulation: #ff6b6b;  /* Color for Regulation type */
      --standard: #51cf66;    /* Color for Standard type */
      --framework: #339af0;   /* Color for Framework type */
      --guideline: #ffd43b;   /* Color for Guideline type */
      --act: #8796a5;   /* Color for act type */
      --strategy: #124125;   /* Color for strategy type */
      --directive: #c24e8e;   /* Color for directive type */
      --policy: #ff000d;   /* Color for policy type */
      --primary: #2b579a;     /* Primary brand color */
      --secondary: #e9ecef;   /* Secondary background color */
      --text: #333;           /* Main text color */
      --light-text: #6c757d;  /* Lighter text color */
    }
    
    /* Universal box sizing */
    * {
      box-sizing: border-box;
    }
    
    /* Base body styles */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      color: var(--text);
      background-color: #f8f9fa;
      line-height: 1.6;
    }
    
    /* Main container styling */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 15px rgba(0,0,0,0.05);
    }
    
    /* Page heading styles */
    h1 {
      color: var(--primary);
      margin-bottom: 5px;
    }
    
    /* Subtitle styling */
    .subtitle {
      color: var(--light-text);
      margin-bottom: 25px;
    }
    
    /* Controls section styling */
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
      align-items: end;
    }
    
    /* Full-width search container */
    .search-container {
      grid-column: 1 / -1;
    }
    
    /* Filter group styling (label + input) */
    .filter-group {
      display: flex;
      flex-direction: column;
    }
    
    /* Filter label styling */
    .filter-group label {
      font-size: 0.85em;
      margin-bottom: 6px;
      color: var(--light-text);
      font-weight: 600;
    }
    
    /* Input and select element styling */
    input, select {
      padding: 10px 12px;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      font-size: 0.95em;
      width: 100%;
    }
    
    /* Focus states for inputs */
    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(43, 87, 154, 0.15);
    }
    
    /* Matrix container with horizontal scrolling */
    .matrix-container {
      overflow-x: auto;
      margin-bottom: 30px;
      border: 1px solid #dee2e6;
      border-radius: 6px;
    }
    
    /* Table styling */
    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 800px; /* Minimum width to prevent squeezing */
    }
    
    /* Table cell styling */
    th, td {
      border: 1px solid #dee2e6;
      padding: 12px 15px;
      text-align: left;
    }
    
    /* Table header styling */
    th {
      background-color: #f8f9fa;
      font-weight: 600;
      position: sticky;
      top: 0;
    }
    
    /* Corner header that stays fixed during scrolling */
    .corner-header {
      position: sticky;
      left: 0;
      z-index: 10;
      background-color: #f8f9fa;
    }
    
    /* Framework item styling */
    .framework-item {
      margin-bottom: 8px;
      padding: 8px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
    }
    
    /* Hover state for framework items */
    .framework-item:hover {
      background-color: #f1f3f5;
    }
    
    /* Type badge styling */
    .type-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75em;
      font-weight: 600;
      margin-right: 10px;
      color: white;
      min-width: 80px;
      text-align: center;
    }
    
    /* Color classes for different framework types */
    .Regulation { background-color: var(--regulation); }
    .Standard { background-color: var(--standard); }
    .Framework { background-color: var(--framework); }
    .Guideline { background-color: var(--guideline); }
    .Policy { background-color: var(--policy); }
    .Strategy { background-color: var(--strategy); }
    .Act { background-color: var(--act); }
    .Directive { background-color: var(--directive); }
    
    /* Empty cell styling */
    .empty-cell {
      color: #adb5bd;
      text-align: center;
      font-style: italic;
    }
    
    /* Legend container styling */
    .legend {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    
    /* Individual legend item styling */
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9em;
    }
    
    /* Color swatch in legend */
    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }
    
    /* Modal dialog styling */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    
    /* Modal content area */
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 8px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    
    /* Modal title styling */
    .modal-title {
      font-size: 1.5em;
      margin-bottom: 10px;
      color: var(--primary);
    }
    
    /* Framework type in modal */
    .modal-type {
      display: inline-block;
      margin-bottom: 15px;
    }
    
    /* Description text in modal */
    .modal-description {
      margin-bottom: 20px;
      line-height: 1.6;
    }
    
    /* Source link section in modal */
    .modal-source {
      margin-top: 20px;
    }
    
    /* Source link styling */
    .modal-source a {
      color: var(--primary);
      text-decoration: none;
    }
    
    /* Source link hover state */
    .modal-source a:hover {
      text-decoration: underline;
    }
    
    /* Close button in modal */
    .close-btn {
      float: right;
      cursor: pointer;
      font-size: 1.5em;
      margin-top: -10px;
    }
    
    /* Action buttons container */
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    
    /* Base button styling */
    .btn {
      padding: 10px 16px;
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.95em;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s;
    }
    
    /* Button hover state */
    .btn:hover {
      background-color: #1e4b8b;
    }
    
    /* SVG icons in buttons */
    .btn svg {
      width: 16px;
      height: 16px;
    }
    
    /* Responsive styles for smaller screens */
    @media (max-width: 768px) {
      /* Stack controls vertically on mobile */
      .controls {
        grid-template-columns: 1fr;
      }
      
      /* Adjust container padding */
      .container {
        padding: 15px;
      }
      
      /* Reduce cell padding */
      th, td {
        padding: 8px 10px;
      }
    }
  </style>
</head>
<body>
  <!-- Main container for all content -->
  <div class="container">
    <!-- Page header -->
    <h1>Compliance Framework Matrix</h1>
    <div class="subtitle">Interactive mapping of frameworks across industries and locations</div>
    
    <!-- Color legend for framework types -->
    <div class="legend">
      <div class="legend-item">
        <div class="legend-color" style="background-color: var(--regulation);"></div>
        <span>Regulation</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background-color: var(--standard);"></div>
        <span>Standard</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background-color: var(--framework);"></div>
        <span>Framework</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background-color: var(--guideline);"></div>
        <span>Guideline</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background-color: var(--policy);"></div>
        <span>Policy</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background-color: var(--strategy);"></div>
        <span>Strategy</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background-color: var(--act);"></div>
        <span>Act</span>
      </div>
      <div class="legend-item">
        <div class="legend-color" style="background-color: var(--directive);"></div>
        <span>Directive</span>
      </div>
    </div>
    
    <!-- Filter controls section -->
    <div class="controls">
      <!-- Search input -->
      <div class="filter-group search-container">
        <label for="searchInput">Search Frameworks</label>
        <input type="text" id="searchInput" placeholder="Search by name, acronym, or keyword...">
      </div>
      
      <!-- Industry filter dropdown -->
      <div class="filter-group">
        <label for="industryFilter">Industry</label>
        <select id="industryFilter">
          <option value="">All Industries</option>
        </select>
      </div>
      
      <!-- Location filter dropdown -->
      <div class="filter-group">
        <label for="locationFilter">Location</label>
        <select id="locationFilter">
          <option value="">All Locations</option>
        </select>
      </div>
      
      <!-- Type filter dropdown -->
      <div class="filter-group">
        <label for="typeFilter">Type</label>

          <option value="">All Types</option>
        </select>
      </div>
    </div>
    
    <!-- Matrix display container -->
    <div class="matrix-container">
      <table id="matrix">
        <thead id="matrix-header"></thead>
        <tbody id="matrix-body"></tbody>
      </table>
    </div>
    
    <!-- Action buttons -->
    <div class="actions">
      <!-- Export to CSV button -->
      <button class="btn" id="exportCsv">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        Export CSV
      </button>
      
      <!-- Export to PDF button -->
      <button class="btn" id="exportPdf">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        Export PDF
      </button>
      
      <!-- Reset filters button -->
      <button class="btn" id="resetFilters">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <polyline points="23 20 23 14 17 14"></polyline>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
        </svg>
        Reset Filters
      </button>
    </div>
  </div>

  <!-- Modal dialog for framework details -->
  <div id="frameworkModal" class="modal">
    <div class="modal-content">
      <!-- Close button -->
      <span class="close-btn">&times;</span>
      
      <!-- Modal content elements -->
      <h2 class="modal-title" id="modalTitle"></h2>
      <div class="modal-type" id="modalType"></div>
      <div class="modal-description" id="modalDescription"></div>
      <div class="modal-source">
        <strong>Source:</strong> <a id="modalSource" target="_blank">View official documentation</a>
      </div>
    </div>
  </div>

  <!-- Main application JavaScript -->
  <script>
    // Global variables to store framework data
    let allData = [];          // All loaded framework data
    let filteredData = [];     // Data after applying filters
    let uniqueIndustries = []; // Unique industry categories
    let uniqueLocations = [];  // Unique location categories
    let uniqueTypes = [];      // Unique framework types
    
    // DOM element references
    const modal = document.getElementById("frameworkModal");
    const closeBtn = document.querySelector(".close-btn");

    // Close modal when clicking the X button
    closeBtn.onclick = function() { modal.style.display = "none"; }
    
    // Close modal when clicking outside the content
    window.onclick = function(event) {
      if (event.target == modal) modal.style.display = "none";
    }

    // Initialize application when DOM is loaded
    document.addEventListener('DOMContentLoaded', function() {
      // Load and parse CSV data
      Papa.parse("Framework Mapping Library.csv", {
        download: true,
        header: true,
        complete: function(results) {
          // Filter out empty rows and process data
          allData = results.data.filter(row => row.Name && row.Name.trim() !== '');
          
          // Normalize all "Global" location variants to a single "Global" category
          allData = allData.map(item => {
            if (item.Location && item.Location.toLowerCase().includes("global")) {
              return {...item, Location: "Global"};
            }
            return item;
          });
          
          // Process the loaded data
          processData();
          
          // Populate filter dropdowns
          populateFilters();
          
          // Render the initial matrix view
          renderMatrix();
          
          // Set up event listeners
          setupEventListeners();
        },
        error: function(error) {
          // Handle CSV loading errors
          console.error("Error loading CSV:", error);
          alert("Error loading data. Please check console for details.");
        }
      });
    });

    // Process loaded data to extract unique categories
    function processData() {
      const industries = new Set();
      const locations = new Set();
      const types = new Set();
      
      allData.forEach(entry => {
        // Process industries
        if (entry.Industry) {
          entry.Industry.split(',').forEach(i => industries.add(i.trim()));
        }

        // Process locations
        if (entry.Location) {
          locations.add(entry.Location.trim());
        }

        // Process framework types (normalize capitalization + trim)
        if (entry.Type) {
          const normalizedType = entry.Type.trim().toLowerCase();  // normalize
          // Capitalize first letter for display
          const displayType = normalizedType.charAt(0).toUpperCase() + normalizedType.slice(1);
          types.add(displayType);
        }
      });
      
      uniqueIndustries = [...industries].sort();
      uniqueLocations = [...locations].sort();
      uniqueTypes = [...types].sort();
      
      filteredData = [...allData];
    }

    // Populate filter dropdowns with unique values
    function populateFilters() {
      // Industry filter dropdown
      const industryFilter = document.getElementById("industryFilter");
      industryFilter.innerHTML = '<option value="">All Industries</option>'; // reset first
      uniqueIndustries.forEach(ind => {
        const option = document.createElement("option");
        option.value = ind;
        option.textContent = ind;
        industryFilter.appendChild(option);
      });

      // Location filter dropdown
      const locationFilter = document.getElementById("locationFilter");
      locationFilter.innerHTML = '<option value="">All Locations</option>'; // reset first
      uniqueLocations.forEach(loc => {
        const option = document.createElement("option");
        option.value = loc;
        option.textContent = loc;
        locationFilter.appendChild(option);
      });

      // Type filter dropdown
      const typeFilter = document.getElementById("typeFilter");
            typeFilter.innerHTML = '<option value="">All Types</option>';
            uniqueTypes.forEach(type => {
                const option = document.createElement("option");
                option.value = type;
                option.textContent = type;
                typeFilter.appendChild(option);
      });
    }

    // Set up all event listeners
    function setupEventListeners() {
      // Search input with debounce to improve performance
      document.getElementById("searchInput").addEventListener("input", debounce(applyFilters, 300));
      
      // Filter dropdown change events
      document.getElementById("industryFilter").addEventListener("change", applyFilters);
      document.getElementById("locationFilter").addEventListener("change", applyFilters);
      document.getElementById("typeFilter").addEventListener("change", applyFilters);
      
      // Action button click events
      document.getElementById("exportCsv").addEventListener("click", exportToCsv);
      document.getElementById("exportPdf").addEventListener("click", exportToPdf);
      document.getElementById("resetFilters").addEventListener("click", resetFilters);
    }

    // Apply all active filters to the data
    function applyFilters() {
      // Get current filter values
      const searchTerm = document.getElementById("searchInput").value.toLowerCase();
      const industry = document.getElementById("industryFilter").value;
      const location = document.getElementById("locationFilter").value;
      const type = document.getElementById("typeFilter").value;

      // Filter the data based on current selections
      filteredData = allData.filter(entry => {
        // Search term matching (checks name, description, and objective)
        const matchesSearch = !searchTerm || 
          (entry.Name && entry.Name.toLowerCase().includes(searchTerm)) ||
          (entry.Description && entry.Description.toLowerCase().includes(searchTerm)) ||
          (entry.Objective && entry.Objective.toLowerCase().includes(searchTerm));

        // Industry matching (handles comma-separated values)
        const matchesIndustry = !industry || 
          (entry.Industry && entry.Industry.split(',').some(
            i => i.trim().toLowerCase() === industry.toLowerCase()
          ));

        // Location matching
        const matchesLocation = !location || 
          (entry.Location && entry.Location.trim().toLowerCase() === location.toLowerCase());

        // Type matching
        const matchesType = !type || 
          (entry.Type && entry.Type.trim().toLowerCase() === type.toLowerCase());

        // Only include entries that match all active filters
        return matchesSearch && matchesIndustry && matchesLocation && matchesType;
      });

      // Re-render the matrix with filtered data
      renderMatrix();
    }

    // Render the matrix table based on current filters
    function renderMatrix() {
    const matrixHeader = document.getElementById("matrix-header");
    const matrixBody = document.getElementById("matrix-body");
    
    // Clear existing table content
    matrixHeader.innerHTML = "";
    matrixBody.innerHTML = "";
    
    // Get current unique industries and locations from filtered data
    const currentIndustries = [...new Set(filteredData.flatMap(d => 
        (d.Industry || "").split(',').map(i => i.trim()).filter(i => i)
    ))].sort();
    
    const currentLocations = [...new Set(filteredData.map(d => d.Location).filter(l => l))].sort();
    
    // Create table header row
    const headerRow = document.createElement("tr");
    const cornerHeader = document.createElement("th");
    cornerHeader.textContent = "Industry \\ Location";
    cornerHeader.className = "corner-header";
    headerRow.appendChild(cornerHeader);
    
    // Add location headers
    currentLocations.forEach(loc => {
        const th = document.createElement("th");
        th.textContent = loc;
        headerRow.appendChild(th);
    });
    
    matrixHeader.appendChild(headerRow);
    
    // Create table body with framework data
    currentIndustries.forEach(ind => {
        const row = document.createElement("tr");
        const industryHeader = document.createElement("th");
        industryHeader.textContent = ind;
        industryHeader.className = "corner-header";
        row.appendChild(industryHeader);
        
        // Add framework cells for each location
        currentLocations.forEach(loc => {
            const cell = document.createElement("td");
            
            // Find frameworks matching current industry and location
            const frameworks = filteredData.filter(d => 
                (d.Industry || "").includes(ind) && d.Location === loc
            );
            
            if (frameworks.length > 0) {
                // ========== ADD "SHOW MORE" FUNCTIONALITY HERE ==========
                // Create framework items for each matching framework (max 3 initially)
                const maxToShow = 3;
                const frameworksToShow = frameworks.slice(0, maxToShow);
                const hasMore = frameworks.length > maxToShow;
                
                frameworksToShow.forEach(fw => {
                    const frameworkElement = document.createElement("div");
                    frameworkElement.className = "framework-item";
                    
                    // Add type badge if available
                    if (fw.Type) {
                        const typeBadge = document.createElement("span");
                        typeBadge.className = `type-badge ${fw.Type}`;
                        typeBadge.textContent = fw.Type;
                        frameworkElement.appendChild(typeBadge);
                    }
                    
                    // Add framework name
                    const nameSpan = document.createElement("span");
                    nameSpan.textContent = fw.Name;
                    frameworkElement.appendChild(nameSpan);
                    
                    // Add click handler to show details modal
                    frameworkElement.addEventListener("click", () => showFrameworkDetails(fw));
                    cell.appendChild(frameworkElement);
                });
                
                // Add "Show more" button if there are more frameworks
                if (hasMore) {
                    const showMoreBtn = document.createElement("button");
                    showMoreBtn.className = "show-more-btn";
                    showMoreBtn.textContent = `Show ${frameworks.length - maxToShow} more...`;
                    showMoreBtn.dataset.industry = ind;
                    showMoreBtn.dataset.location = loc;
                    showMoreBtn.addEventListener("click", function(e) {
                        e.stopPropagation();
                        showAllFrameworks(this.dataset.industry, this.dataset.location, frameworks);
                    });
                    cell.appendChild(showMoreBtn);
                }
                // ========== END OF "SHOW MORE" FUNCTIONALITY ==========
            } else {
                // Empty cell if no frameworks match
                cell.textContent = "-";
                cell.className = "empty-cell";
            }
            
            row.appendChild(cell);
        });
        
        matrixBody.appendChild(row);
    });
}

    // Show modal with framework details
    function showFrameworkDetails(framework) {
      // Set framework name in modal
      document.getElementById("modalTitle").textContent = framework.Name;
      
      // Clear and rebuild type badge
      const typeElement = document.getElementById("modalType");
      typeElement.innerHTML = "";
      
      // Add type badge if available
      if (framework.Type) {
        const typeBadge = document.createElement("span");
        typeBadge.className = `type-badge ${framework.Type}`;
        typeBadge.textContent = framework.Type;
        typeElement.appendChild(typeBadge);
      }
      
      // Set description text
      document.getElementById("modalDescription").textContent = 
        framework.Description || "No description available";
      
      // Set up source link
      const sourceLink = document.getElementById("modalSource");
      if (framework.Source) {
        sourceLink.href = framework.Source;
        sourceLink.textContent = "View official documentation";
        sourceLink.style.display = "inline";
      } else {
        sourceLink.style.display = "none";
      }
      
      // Display the modal
      modal.style.display = "flex";
    }

    // Export filtered data to CSV
    function exportToCsv() {
      // Prepare data for CSV export
      const csvData = filteredData.map(d => ({
        Name: d.Name,
        Type: d.Type,
        Location: d.Location,
        Industry: d.Industry,
        Objective: d.Objective,
        Description: d.Description,
        Source: d.Source
      }));
      
      // Convert to CSV string
      const csv = Papa.unparse(csvData);
      
      // Create download link
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      
      // Trigger download
      const a = document.createElement("a");
      a.href = url;
      a.download = "compliance_frameworks.csv";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Export filtered data to PDF
    function exportToPdf() {
      // Initialize PDF document
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({
        orientation: "landscape",
        unit: "mm"
      });
      
      // Add title
      doc.setFontSize(16);
      doc.setTextColor(43, 87, 154);
      doc.text("Compliance Framework Matrix", 105, 15, { align: "center" });
      
      // Add current filter info
      doc.setFontSize(10);
      doc.setTextColor(100, 100, 100);
      const filters = [
        `Search: ${document.getElementById("searchInput").value || "All"}`,
        `Industry: ${document.getElementById("industryFilter").value || "All"}`,
        `Location: ${document.getElementById("locationFilter").value || "All"}`,
        `Type: ${document.getElementById("typeFilter").value || "All"}`
      ];
      doc.text(filters.join(" | "), 15, 25);
      
      // Prepare table data
      const rows = [];
      filteredData.forEach(fw => {
        const industries = fw.Industry ? fw.Industry.split(',').map(i => i.trim()) : ["N/A"];
        industries.forEach(ind => {
          rows.push({
            industry: ind,
            location: fw.Location || "N/A",
            name: fw.Name,
            type: fw.Type || "N/A"
          });
        });
      });
      
      // Sort rows by industry then location
      rows.sort((a, b) => {
        if (a.industry < b.industry) return -1;
        if (a.industry > b.industry) return 1;
        return a.location.localeCompare(b.location);
      });
      
      // Add table headers
      doc.setFontSize(12);
      doc.setTextColor(0, 0, 0);
      doc.setDrawColor(200, 200, 200);
      doc.setFillColor(240, 240, 240);
      doc.rect(15, 30, 260, 8, "F");
      doc.text("Industry", 15, 35);
      doc.text("Location", 60, 35);
      doc.text("Framework", 100, 35);
      doc.text("Type", 200, 35);
      
      // Add table content
      doc.setFontSize(10);
      let y = 40;
      
      rows.forEach((row, index) => {
        // Add new page if running out of space
        if (y > 190) {
          doc.addPage();
          y = 15;
          // Repeat headers on new page
          doc.setFontSize(12);
          doc.rect(15, 15, 260, 8, "F");
          doc.text("Industry", 15, 20);
          doc.text("Location", 60, 20);
          doc.text("Framework", 100, 20);
          doc.text("Type", 200, 20);
          doc.setFontSize(10);
          y = 25;
        }
        
        // Add row data
        doc.text(row.industry, 15, y);
        doc.text(row.location, 60, y);
        doc.text(row.name, 100, y, { maxWidth: 90 });
        
        // Color-code the type text
        if (row.type === "Regulation") doc.setTextColor(204, 0, 0);
        else if (row.type === "Standard") doc.setTextColor(0, 170, 0);
        else if (row.type === "Framework") doc.setTextColor(43, 87, 154);
        else if (row.type === "Guideline") doc.setTextColor(255, 170, 0);
        else if (row.type === "Policy") doc.setTextColor(255, 0, 13);
        else if (row.type === "Strategy") doc.setTextColor(18, 65, 37);
        else if (row.type === "Act") doc.setTextColor(135, 150, 165);
        else if (row.type === "Directive") doc.setTextColor(255,255,255);
        else doc.setTextColor(100, 100, 100);
        
        doc.text(row.type, 200, y);
        doc.setTextColor(0, 0, 0);
        
        y += 7;
      });
      
      // Save the PDF
      doc.save("compliance_frameworks.pdf");
    }

    // Reset all filters to default state
    function resetFilters() {
      document.getElementById("searchInput").value = "";
      document.getElementById("industryFilter").value = "";
      document.getElementById("locationFilter").value = "";
      document.getElementById("typeFilter").value = "";
      filteredData = [...allData];
      renderMatrix();
    }

    // Debounce function to limit how often a function is called
    function debounce(func, wait) {
      let timeout;
      return function() {
        const context = this, args = arguments;
        clearTimeout(timeout);
        timeout = setTimeout(() => {
          func.apply(context, args);
        }, wait);
      };
    }

    // Show all frameworks for a specific industry-location combination
function showAllFrameworks(industry, location, frameworks) {
    // Create modal for showing all frameworks
    const modal = document.createElement("div");
    modal.className = "modal";
    modal.style.display = "flex";
    
    const modalContent = document.createElement("div");
    modalContent.className = "modal-content";
    modalContent.style.maxWidth = "800px";
    
    const closeBtn = document.createElement("span");
    closeBtn.className = "close-btn";
    closeBtn.innerHTML = "&times;";
    closeBtn.onclick = function() {
        document.body.removeChild(modal);
    };
    
    const title = document.createElement("h2");
    title.className = "modal-title";
    title.textContent = `Frameworks for ${industry} in ${location}`;
    
    modalContent.appendChild(closeBtn);
    modalContent.appendChild(title);
    
    // Create list of all frameworks
    frameworks.forEach(fw => {
        const frameworkElement = document.createElement("div");
        frameworkElement.className = "framework-item";
        frameworkElement.style.margin = "10px 0";
        
        // Add type badge if available
        if (fw.Type) {
            const typeBadge = document.createElement("span");
            typeBadge.className = `type-badge ${fw.Type}`;
            typeBadge.textContent = fw.Type;
            frameworkElement.appendChild(typeBadge);
        }
        
        // Add framework name
        const nameSpan = document.createElement("span");
        nameSpan.textContent = fw.Name;
        frameworkElement.appendChild(nameSpan);
        
        // Add click handler to show details modal
        frameworkElement.addEventListener("click", () => {
            document.body.removeChild(modal);
            showFrameworkDetails(fw);
        });
        
        modalContent.appendChild(frameworkElement);
    });
    
    modal.appendChild(modalContent);
    document.body.appendChild(modal);
    
    // Close modal when clicking outside the content
    modal.addEventListener("click", function(e) {
        if (e.target === modal) {
            document.body.removeChild(modal);
        }
    });
}


function renderSummaryRows() {
  let existing = document.getElementById("summaryRowsSimple");
  if (existing) existing.remove();

  const container = document.createElement("div");
  container.id = "summaryRowsSimple";
  container.style.margin = "20px 0";
  container.style.padding = "12px";
  container.style.background = "#f8f9fa";
  container.style.border = "1px solid #dee2e6";
  container.style.borderRadius = "6px";

  // Collect unique countries and industries
  const countries = [...new Set(filteredData.map(f => f.Location).filter(Boolean))].sort();
  const industries = [...new Set(filteredData.flatMap(f => (f.Industry || "").split(",").map(i => i.trim()).filter(Boolean)))].sort();

  // Row for Countries
  const countryRow = document.createElement("div");
  countryRow.style.marginBottom = "12px";
  const countryLabel = document.createElement("strong");
  countryLabel.textContent = "Countries: ";
  countryRow.appendChild(countryLabel);

  countries.forEach((c, idx) => {
    const link = document.createElement("a");
    link.href = "#";
    link.textContent = c;
    link.style.color = "#2b579a";
    link.style.marginRight = "12px";
    link.addEventListener("click", (e) => {
      e.preventDefault();
      renderFilteredTable({ location: c });
    });
    countryRow.appendChild(link);
    if (idx < countries.length - 1) {
      // Add separator
      const sep = document.createElement("span");
      sep.textContent = "| ";
      countryRow.appendChild(sep);
    }
  });

  // Row for Industries
  const industryRow = document.createElement("div");
  const industryLabel = document.createElement("strong");
  industryLabel.textContent = "Industries: ";
  industryRow.appendChild(industryLabel);

  industries.forEach((i, idx) => {
    const link = document.createElement("a");
    link.href = "#";
    link.textContent = i;
    link.style.color = "#2b579a";
    link.style.marginRight = "12px";
    link.addEventListener("click", (e) => {
      e.preventDefault();
      renderFilteredTable({ industry: i });
    });
    industryRow.appendChild(link);
    if (idx < industries.length - 1) {
      const sep = document.createElement("span");
      sep.textContent = "| ";
      industryRow.appendChild(sep);
    }
  });

  container.appendChild(countryRow);
  container.appendChild(industryRow);

  const matrixContainer = document.querySelector(".matrix-container");
  matrixContainer.parentNode.insertBefore(container, matrixContainer);
}

// Simple filtered table (reused from before)
function renderFilteredTable(filter) {
  let existing = document.getElementById("filteredTable");
  if (existing) existing.remove();

  const container = document.createElement("div");
  container.id = "filteredTable";
  container.style.margin = "20px 0";
  container.style.padding = "15px";
  container.style.border = "1px solid #dee2e6";
  container.style.borderRadius = "6px";
  container.style.background = "#fff";

  const title = document.createElement("h3");
  if (filter.location) title.textContent = `Frameworks in ${filter.location}`;
  if (filter.industry) title.textContent = `Frameworks for ${filter.industry}`;
  title.style.color = "#2b579a";
  container.appendChild(title);

  const backBtn = document.createElement("button");
  backBtn.textContent = "← Back";
  backBtn.style.marginBottom = "10px";
  backBtn.style.padding = "5px 10px";
  backBtn.style.cursor = "pointer";
  backBtn.addEventListener("click", () => container.remove());
  container.appendChild(backBtn);

  const table = document.createElement("table");
  table.style.borderCollapse = "collapse";
  table.style.width = "100%";
  table.style.marginTop = "10px";

  // Header
  const headerRow = document.createElement("tr");
  ["Name", "Type", "Industry", "Location"].forEach(h => {
    const th = document.createElement("th");
    th.textContent = h;
    th.style.border = "1px solid #dee2e6";
    th.style.padding = "8px";
    th.style.background = "#f1f3f5";
    headerRow.appendChild(th);
  });
  table.appendChild(headerRow);

  // Filtered data
  const filtered = filteredData.filter(f => {
    if (filter.location && f.Location !== filter.location) return false;
    if (filter.industry && !(f.Industry || "").split(",").map(i => i.trim()).includes(filter.industry)) return false;
    return true;
  });

  // Render rows, hide everything after the 5th
  const rowRefs = [];
  filtered.forEach((fw, idx) => {
    const row = document.createElement("tr");
    [fw.Name, fw.Type, fw.Industry, fw.Location].forEach(val => {
      const td = document.createElement("td");
      td.textContent = val || "-";
      td.style.border = "1px solid #dee2e6";
      td.style.padding = "8px";
      row.appendChild(td);
    });
    if (idx >= 5) row.style.display = "none"; // hide after 5
    rowRefs.push(row);
    table.appendChild(row);
  });

  if (filtered.length === 0) {
    const row = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 4;
    td.textContent = "No frameworks found.";
    td.style.textAlign = "center";
    td.style.padding = "12px";
    row.appendChild(td);
    table.appendChild(row);
  }

  container.appendChild(table);

  // Add toggle if more than 5 rows
  if (filtered.length > 5) {
    const toggle = document.createElement("a");
    toggle.href = "#";
    toggle.textContent = "Show more...";
    toggle.style.display = "block";
    toggle.style.color = "#2b579a";
    toggle.style.marginTop = "10px";
    toggle.addEventListener("click", (e) => {
      e.preventDefault();
      const hiddenRows = rowRefs.slice(5); // rows after 5
      const isHidden = hiddenRows[0].style.display === "none";
      hiddenRows.forEach(r => r.style.display = isHidden ? "table-row" : "none");
      toggle.textContent = isHidden ? "Show less..." : "Show more...";
    });
    container.appendChild(toggle);
  }

  const matrixContainer = document.querySelector(".matrix-container");
  matrixContainer.parentNode.insertBefore(container, matrixContainer);
}

// Extend renderMatrix to also render rows summary
const origRenderMatrix3 = renderMatrix;
renderMatrix = function() {
  origRenderMatrix3();
  renderSummaryRows();
};
